plugins {
    id 'com.android.application'
}
android {
    namespace 'com.goreecloud.clips'
    compileSdk 35
    defaultConfig {
        applicationId 'com.goreecloud.clips'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0-dev'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
    buildTypes {
        debug {
            // GitHub-hosted runners use ephemeral debug signing keys. Keep test installs
            // separate from the owner's existing app to avoid destructive uninstall.
            applicationIdSuffix '.dev'
            resValue 'string', 'app_name', 'GoreeCloud Clips Dev'
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'dev.ffmpegkit-maintained:yt-dlp-android:2.0.2'
    testImplementation 'junit:junit:4.13.2'
}
