name: Video Player Device QA
on:
  push:
    branches: [feature/video-first-layout-*, feature/library-browser-tools-*, feature/floating-menu-clean-web-*, feature/refined-dock-unobstructed-tools-*, feature/long-press-video-context-*, feature/centered-dialog, feature/clips-official-icon-context, feature/profile-isolation-v10]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build isolated device QA APK
        run: ./gradlew --no-daemon -PqaSuffix=.profilesqa :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: goreecloud-clips-profilesqa
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
